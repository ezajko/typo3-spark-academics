<f:variable name="entity" value="{entityType -> f:format.case(mode: 'capital')}" />
<f:variable name="entityLower" value="{entityType -> f:format.case(mode: 'lower')}" />

<!-- Read viewType from entity-specific key, e.g. settings.view.viewType.person -->
<f:switch expression="{entityLower}">
    <f:case value="organization">
        <f:variable name="viewType" value="{settings.view.viewType.organization -> f:or(alternative: 'Default')}" />
    </f:case>
    <f:case value="person">
        <f:variable name="viewType" value="{settings.view.viewType.person -> f:or(alternative: 'Default')}" />
    </f:case>
    <f:case value="course">
        <f:variable name="viewType" value="{settings.view.viewType.course -> f:or(alternative: 'Default')}" />
    </f:case>
    <f:case value="studyprogram">
        <f:variable name="viewType" value="{settings.view.viewType.studyprogram -> f:or(alternative: 'Default')}" />
    </f:case>
    <f:case value="project">
        <f:variable name="viewType" value="{settings.view.viewType.project -> f:or(alternative: 'Default')}" />
    </f:case>
    <f:defaultCase>
        <f:variable name="viewType" value="Default" />
    </f:defaultCase>
</f:switch>

<!-- DEBUG: viewType="{viewType}", entity="{entity}", entityLower="{entityLower}" -->

<!-- Frontend Filter (conditional based on settings) -->
<f:if condition="{settings.view.frontendFilter.enabled}">
    <f:render partial="Academic/Entities/{entity}/List/Filter" arguments="{_all}" optional="true" />
</f:if>

<f:render partial="Academic/Entities/{entity}/List/{viewType}"
    arguments="{items: items, settings: settings, detailPid: detailPid}" optional="true">
    <!-- Fallback if specific view type doesn't exist -->
    <f:render partial="Academic/Entities/{entity}/List/List"
        arguments="{items: items, settings: settings, detailPid: detailPid}" optional="true">
        <div class="alert alert-warning">
            Template partial "Partials/Academic/Entities/{entity}/List/{viewType}.html" (or fallback List/List.html) not
            found.
        </div>
    </f:render>
</f:render>

<!-- Pagination Control -->
<f:render partial="Academic/Pagination" arguments="{_all}" optional="true" />
