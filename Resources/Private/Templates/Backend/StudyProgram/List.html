<f:layout name="Module" />

<f:section name="Content">
    <f:render partial="Backend/StudyProgram/Filter"
        arguments="{filter: filter, availableDepartments: availableDepartments, availableChairs: availableChairs, availableCycle: availableCycle}" />

    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>
                        <f:translate key="tx_spark_study_program.title" default="Title" />
                    </th>
                    <th>Cycle</th>
                    <th>Department</th>
                    <th>Chair</th>
                    <th class="col-control"></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{items}" as="item">
                    <tr>
                        <td>
                            <b>{item.item.title}</b><br>
                            <span class="text-muted">{item.item.acronym}</span>
                        </td>
                        <td>
                            <f:if condition="{item.item.studyCycle}">
                                <span class="badge bg-info">{item.item.studyCycle.title}</span>
                            </f:if>
                        </td>
                        <td>
                            <f:if condition="{item.item.department}">
                                {item.item.department.title}
                            </f:if>
                        </td>
                        <td>
                            <f:if condition="{item.item.chair}">
                                {item.item.chair.title}
                            </f:if>
                        </td>
                        <td class="col-control">
                            <div class="btn-group" role="group">
                                <a href="{item.editUrl}" class="btn btn-default btn-sm" title="Edit">
                                    <core:icon identifier="actions-open" />
                                </a>
                            </div>
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>
</f:section>
