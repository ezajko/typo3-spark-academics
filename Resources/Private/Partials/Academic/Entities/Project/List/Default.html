<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="row row-cols-1 row-cols-md-3 g-4">
    <f:for each="{items}" as="item">
        <div class="col">
            <div class="card h-100 shadow-sm border-0">
                <!-- Image -->
                <f:if condition="{item.mainImage}">
                    <f:then>
                        <f:media file="{item.mainImage}" class="card-img-top" alt="{item.title}"
                            style="height: 200px; object-fit: cover;" />
                    </f:then>
                    <f:else>
                        <div class="card-img-top bg-light d-flex align-items-center justify-content-center"
                            style="height: 200px;">
                            <i class="bi bi-kanban fs-1 text-muted"></i>
                        </div>
                    </f:else>
                </f:if>

                <div class="card-body">
                    <!-- Status & Acronym -->
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <f:if condition="{item.status}">
                            <span class="badge"
                                style="background-color: {item.status.color};">{item.status.title}</span>
                        </f:if>
                        <f:if condition="{item.acronym}">
                            <small class="text-muted fw-bold">{item.acronym}</small>
                        </f:if>
                    </div>

                    <!-- Title -->
                    <h5 class="card-title">
                        <f:link.action action="show" arguments="{project: item}" pageUid="{detailPid}" pluginName="Show"
                            extensionName="Academics" class="text-decoration-none text-dark stretched-link">
                            {item.title}
                        </f:link.action>
                    </h5>

                    <!-- Description -->
                    <p class="card-text text-truncate-3">
                        <f:format.crop maxCharacters="120" append="...">
                            <f:format.stripTags>{item.description}</f:format.stripTags>
                        </f:format.crop>
                    </p>
                </div>

                <!-- Footer (Dates) -->
                <div class="card-footer bg-white border-0">
                    <small class="text-muted d-block">
                        <i class="bi bi-calendar-event me-1"></i>
                        <f:if condition="{item.startDate}">
                            <f:format.date format="d.m.Y">{item.startDate}</f:format.date>
                        </f:if>
                        -
                        <f:if condition="{item.endDate}">
                            <f:format.date format="d.m.Y">{item.endDate}</f:format.date>
                        </f:if>
                    </small>
                </div>
            </div>
        </div>
    </f:for>
</div>

</html>
