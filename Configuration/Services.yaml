services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  EtfUnsa\SparkAcademics\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Backend Controllers must be public
  EtfUnsa\SparkAcademics\Controller\Backend\PersonController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\DepartmentController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\ResearchLabController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\ResearchGroupController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\ChairController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\CourseController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\StudyProgramController:
    public: true
  EtfUnsa\SparkAcademics\Controller\Backend\ProjectController:
    public: true

  # Console Commands
  EtfUnsa\SparkAcademics\Command\SeedCommand:
    tags:
      - name: console.command
        command: 'academics:seed'
        description: 'Seed lookup tables with initial data'

  EtfUnsa\SparkAcademics\Command\GenerateTestProjectsCommand:
    tags:
      - name: console.command
        command: 'academics:generate-projects'
        description: 'Generate test projects with faker data'
