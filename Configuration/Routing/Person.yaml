routeEnhancers:
  SparkAcademicsPerson:
    type: Extbase
    extension: SparkAcademics
    plugin: Pi2
    routes:
      -
        routePath: '/person/{person_name}'
        _controller: 'Person::show'
        _arguments:
          person_name: person
    requirements:
      person_name: '^[a-zA-Z0-9\.\-]+$'
    aspects:
      person_name:
        type: PersistedPatternMapper
        tableName: tx_spark_person
        routeFieldPattern: '^(?P<first_name>.+)\.(?P<last_name>.+)$'
        routeFieldResult: '{first_name}.{last_name}'
