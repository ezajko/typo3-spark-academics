<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="card mb-3 shadow-sm border-0">
    <div class="row g-0">
        <div class="col-md-3">
            <f:if condition="{item.mainImage}">
                <f:then>
                    <f:media file="{item.mainImage}" class="img-fluid rounded-start h-100" alt="{item.title}"
                        style="object-fit: cover;" />
                </f:then>
                <f:else>
                    <div class="bg-light h-100 d-flex align-items-center justify-content-center"
                        style="min-height: 150px;">
                        <i class="bi bi-eyedropper fs-1 text-muted"></i>
                    </div>
                </f:else>
            </f:if>
        </div>
        <div class="col-md-9">
            <div class="card-body">
                <h5 class="card-title">
                    <f:link.action action="show" arguments="{lab: item}" pageUid="{detailPid}"
                        class="text-decoration-none text-dark">
                        {item.title}
                    </f:link.action>
                    <f:if condition="{item.acronym}">
                        <small class="text-muted ms-2">({item.acronym})</small>
                    </f:if>
                </h5>

                <p class="card-text">
                    <f:format.crop maxCharacters="200" append="...">
                        <f:format.stripTags>{item.description}</f:format.stripTags>
                    </f:format.crop>
                </p>
                <p class="card-text"><small class="text-muted">
                        <f:if condition="{item.headPerson}">
                            Head: {item.headPerson.title} {item.headPerson.firstName} {item.headPerson.lastName}
                        </f:if>
                    </small></p>

                <div class="mt-2">
                    <f:link.action action="show" arguments="{lab: item}" pageUid="{detailPid}"
                        class="btn btn-sm btn-outline-primary">
                        View Details
                    </f:link.action>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
