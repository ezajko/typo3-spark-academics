routeEnhancers:
  SparkAcademicsDept:
    type: Extbase
    extension: SparkAcademics
    plugin: DeptShow
    routes:
      - { routePath: '/department/{title}', _controller: 'Academic::show', _arguments: { title: department } }
    aspects:
      title: { type: PersistedAliasMapper, tableName: tx_spark_department, routeFieldName: title }

  SparkAcademicsLab:
    type: Extbase
    extension: SparkAcademics
    plugin: LabShow
    routes:
      - { routePath: '/lab/{title}', _controller: 'Academic::show', _arguments: { title: lab } }
