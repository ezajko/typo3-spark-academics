<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="table-fit">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>
                    <f:link.action action="list"
                        arguments="{filter: filter, sort: 'lastName', direction: '{f:if(condition:\"
                        {sort}==\'lastName\'\", then:\"{f:if(condition:\"{direction}==\'asc\'\", then:\"desc\",
                        else:\"asc\")}\", else:\"asc\")}'}">
                        Name
                        <f:if condition="{sort} == 'lastName'">
                            <core:icon
                                identifier="{f:if(condition: '{direction} == \'asc\'', then: 'actions-sort-amount-up', else: 'actions-sort-amount-down')}"
                                size="small" />
                        </f:if>
                    </f:link.action>
                </th>
                <th>Academic Title</th>
                <th>Academic Rank</th>
                <th>Primary Org</th>
                <th>Contact</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <f:for each="{items}" as="row">
                <tr>
                    <td>
                        <b>{row.item.lastName}</b>, {row.item.firstName}
                    </td>
                    <td>
                        <f:if condition="{row.item.academicTitle}">
                            {row.item.academicTitle.title}
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{row.item.academicRank}">
                            <span class="badge bg-info">{row.item.academicRank.title}</span>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{row.item.primaryOrganization}">
                            {row.item.primaryOrganization.title}
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{row.item.contactEmail}">
                            <a href="mailto:{row.item.contactEmail}">{row.item.contactEmail}</a><br>
                        </f:if>
                        <f:if condition="{row.item.phoneOffice}">
                            <small class="text-muted">
                                <core:icon identifier="actions-phone" size="small" /> {row.item.phoneOffice}
                            </small>
                        </f:if>
                    </td>
                    <td>
                        <a href="{row.editUrl}" class="btn btn-default btn-sm">
                            <core:icon identifier="actions-open" size="small" /> Edit
                        </a>
                    </td>
                </tr>
            </f:for>
            <f:if condition="{items -> f:count()} == 0">
                <tr>
                    <td colspan="6" class="text-center text-muted py-4">
                        <core:icon identifier="actions-search" size="medium" /><br>
                        No people found matching your criteria.
                    </td>
                </tr>
            </f:if>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<f:render partial="Backend/Pagination" arguments="{_all}" />

</html>
