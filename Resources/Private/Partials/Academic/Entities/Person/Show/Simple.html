<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Person Show/Simple Template
    Compact view for Person entity - minimal layout without tabs
    Author: Ernedin Zajko <ezajko@root.ba>
-->
<div class="person-simple">
    <div class="row">
        <!-- Image Column -->
        <div class="col-auto">
            <f:if condition="{item.mediaImage}">
                <f:then>
                    <f:media file="{item.mediaImage}" class="rounded-circle shadow-sm"
                        style="width: 100px; height: 100px; object-fit: cover;"
                        alt="{item.firstName} {item.lastName}" />
                </f:then>
                <f:else>
                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center shadow-sm"
                        style="width: 100px; height: 100px;">
                        <i class="bi bi-person fs-3 text-muted"></i>
                    </div>
                </f:else>
            </f:if>
        </div>

        <!-- Content Column -->
        <div class="col">
            <h3 class="mb-1">{item.academicTitle.title} {item.firstName} {item.lastName}</h3>
            <p class="text-muted mb-2">{item.academicRank.title}</p>

            <f:if condition="{item.primaryOrganization}">
                <p class="small text-muted mb-2">
                    <i class="bi bi-building me-1"></i>{item.primaryOrganization.title}
                </p>
            </f:if>

            <div class="d-flex flex-wrap gap-2">
                <f:if condition="{item.contactEmail}">
                    <a href="mailto:{item.contactEmail}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-envelope me-1"></i>
                        <f:translate key="fe.email" extensionName="spark_academics" />
                    </a>
                </f:if>
                <f:if condition="{item.phoneOffice}">
                    <a href="tel:{item.phoneOffice}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-telephone me-1"></i>
                        <f:translate key="fe.call" extensionName="spark_academics" />
                    </a>
                </f:if>
            </div>
        </div>
    </div>

    <!-- Biography (truncated) -->
    <f:if condition="{item.biography}">
        <div class="mt-3">
            <f:format.crop maxCharacters="300" append="...">
                <f:format.stripTags>{item.biography}</f:format.stripTags>
            </f:format.crop>
        </div>
    </f:if>
</div>

</html>
