<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Project Filter Partial
    Filtering form for projects (Search, Status, Type, Program, Field)
-->
<div class="project-filter card border-0 bg-light mb-4">
    <div class="card-body">
        <f:form action="listFiltered" controller="Academic" extensionName="SparkAcademics" pluginName="Pi1" method="get"
            name="filter" object="{filter}" ignoreProtection="true">
            <div class="row g-3">
                <!-- Search -->
                <div class="col-md-4">
                    <label class="form-label small text-muted">Search</label>
                    <f:form.textfield property="search" class="form-control" placeholder="Search keywords..." />
                </div>

                <!-- Status -->
                <div class="col-md-2">
                    <label class="form-label small text-muted">Status</label>
                    <f:form.select property="status" options="{availableStatuses}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Statuses"
                        prependOptionValue="" />
                </div>

                <!-- Type -->
                <div class="col-md-3">
                    <label class="form-label small text-muted">Project Type</label>
                    <f:form.select property="type" options="{availableTypes}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Types"
                        prependOptionValue="" />
                </div>

                <!-- Funding -->
                <div class="col-md-3">
                    <label class="form-label small text-muted">Funding Program</label>
                    <f:form.select property="program" options="{availablePrograms}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Programs"
                        prependOptionValue="" />
                </div>

                <!-- Scientific Field -->
                <div class="col-md-10">
                    <label class="form-label small text-muted">Scientific Field</label>
                    <f:form.select property="field" options="{availableFields}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Fields"
                        prependOptionValue="" />
                </div>

                <!-- Submit -->
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-filter me-1"></i>
                        Filter</button>
                </div>
            </div>
        </f:form>
    </div>
</div>

</html>
