<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Course Backend List Template
    Shows Course list with Organization, Syllabus count
    
    Author: Ernedin Zajko <ezajko@root.ba>
-->
<f:layout name="Module" />

<f:section name="Content">
    <!-- Search Filter -->
    <!-- Custom Filter -->
    <f:render partial="Backend/Course/Filter"
        arguments="{filter: filter, availableCycle: availableCycle, availableCategories: availableCategories, availableFields: availableFields}" />

    <!-- Course List Table -->
    <div class="module-body">
        <f:if condition="{items}">
            <f:then>
                <div class="table-fit">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Title</th>
                                <th>Organization</th>
                                <th>Syllabi</th>
                                <th style="width: 100px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{items}" as="itemData">
                                <tr>
                                    <!-- Code -->
                                    <td class="align-middle">
                                        <f:if condition="{itemData.item.code}">
                                            <code>{itemData.item.code}</code>
                                        </f:if>
                                    </td>

                                    <!-- Title -->
                                    <td class="align-middle">
                                        <b>{itemData.item.title}</b>
                                        <f:if condition="{itemData.item.acronym}">
                                            <span class="badge bg-secondary ms-1">{itemData.item.acronym}</span>
                                        </f:if>
                                        <f:if condition="{itemData.item.description}">
                                            <br />
                                            <small class="text-muted">
                                                <f:format.crop maxCharacters="60">{itemData.item.description}
                                                </f:format.crop>
                                            </small>
                                        </f:if>
                                    </td>

                                    <!-- Organization -->
                                    <td class="align-middle">
                                        <f:if condition="{itemData.item.organization}">
                                            <small>{itemData.item.organization.title}</small>
                                        </f:if>
                                    </td>

                                    <!-- Syllabi Count -->
                                    <td class="align-middle">
                                        <f:if condition="{itemData.item.syllabi}">
                                            <f:then>
                                                <span class="badge bg-info">{itemData.item.syllabi -> f:count()}</span>
                                            </f:then>
                                            <f:else>
                                                <span class="badge bg-warning">0</span>
                                            </f:else>
                                        </f:if>
                                    </td>

                                    <!-- Actions -->
                                    <td class="align-middle">
                                        <a href="{itemData.editUrl}" class="btn btn-default btn-sm">
                                            <core:icon identifier="actions-open" size="small" />
                                            <f:translate
                                                key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.edit" />
                                        </a>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:be.infobox title="No courses found" state="1">
                    <p>No courses found matching your criteria. Click the "+" button to create a new course.</p>
                </f:be.infobox>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
