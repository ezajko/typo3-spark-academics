routeEnhancers:
  SparkAcademics:
    type: Extbase
    extension: SparkAcademics
    plugin: Pi1
    routes:
      - { routePath: '/department/{department}', _controller: 'Academic::show', _arguments: { department: department } }
      - { routePath: '/lab/{lab}', _controller: 'Academic::show', _arguments: { lab: lab } }
      - { routePath: '/group/{group}', _controller: 'Academic::show', _arguments: { group: group } }
      - { routePath: '/chair/{chair}', _controller: 'Academic::show', _arguments: { chair: chair } }
      - { routePath: '/course/{course}', _controller: 'Academic::show', _arguments: { course: course } }
      - { routePath: '/program/{program}', _controller: 'Academic::show', _arguments: { program: program } }
      - { routePath: '/project/{project}', _controller: 'Academic::show', _arguments: { project: project } }
      - { routePath: '/person/{person}', _controller: 'Academic::show', _arguments: { person: person } }
      # Backward compatibility or nice URLs for list filtering? (Optional)
    aspects:
      department: { type: PersistedAliasMapper, tableName: tx_spark_department, routeFieldName: title }
      lab: { type: PersistedAliasMapper, tableName: tx_spark_research_lab, routeFieldName: title }
      group: { type: PersistedAliasMapper, tableName: tx_spark_research_group, routeFieldName: title }
      chair: { type: PersistedAliasMapper, tableName: tx_spark_chair, routeFieldName: title }
      course: { type: PersistedAliasMapper, tableName: tx_spark_course, routeFieldName: title }
      program: { type: PersistedAliasMapper, tableName: tx_spark_study_program, routeFieldName: title }
      project: { type: PersistedAliasMapper, tableName: tx_spark_project, routeFieldName: title }
      person:
        type: PersistedPatternMapper
        tableName: tx_spark_person
        routeFieldPattern: '^(?P<first_name>.+)\.(?P<last_name>.+)$'
        routeFieldResult: '{first_name}.{last_name}'
