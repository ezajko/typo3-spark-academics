<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{paginator.numberOfPages} > 1">
    <nav aria-label="Page navigation" class="mt-5">
        <ul class="pagination justify-content-center">

            <!-- Previous Page -->
            <f:if condition="{pagination.previousPageNumber}">
                <f:then>
                    <li class="page-item">
                        <f:link.action action="listFiltered" controller="Academic" extensionName="Academics"
                            pluginName="List" arguments="{currentPage: pagination.previousPageNumber, filter: filter}"
                            class="page-link" title="{f:translate(key: 'pagination.previous', default: 'Previous')}">
                            <i class="bi bi-chevron-left"></i>
                        </f:link.action>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled">
                        <span class="page-link"><i class="bi bi-chevron-left"></i></span>
                    </li>
                </f:else>
            </f:if>

            <!-- Pages -->
            <f:for each="{pagination.allPageNumbers}" as="page">
                <li class="page-item {f:if(condition: '{page} == {paginator.currentPageNumber}', then: 'active')}">
                    <f:link.action action="listFiltered" controller="Academic" extensionName="Academics"
                        pluginName="List" arguments="{currentPage: page, filter: filter}" class="page-link">
                        {page}
                    </f:link.action>
                </li>
            </f:for>

            <!-- Next Page -->
            <f:if condition="{pagination.nextPageNumber}">
                <f:then>
                    <li class="page-item">
                        <f:link.action action="listFiltered" controller="Academic" extensionName="Academics"
                            pluginName="List" arguments="{currentPage: pagination.nextPageNumber, filter: filter}"
                            class="page-link" title="{f:translate(key: 'pagination.next', default: 'Next')}">
                            <i class="bi bi-chevron-right"></i>
                        </f:link.action>
                    </li>
                </f:then>
                <f:else>
                    <li class="page-item disabled">
                        <span class="page-link"><i class="bi bi-chevron-right"></i></span>
                    </li>
                </f:else>
            </f:if>
        </ul>

        <div class="text-center text-muted small mt-2">
            <f:translate key="pagination.info"
                arguments="{0: pagination.startRecordNumber, 1: pagination.endRecordNumber}" />
        </div>
    </nav>
</f:if>

</html>
