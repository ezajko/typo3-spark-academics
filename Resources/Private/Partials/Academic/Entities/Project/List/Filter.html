<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Project Frontend Filter
    Filter by status, type, funding program, organization
    Author: Ernedin Zajko <ezajko@root.ba>
-->

<div class="spark-academics-filter mb-4 p-4 bg-light rounded">
    <f:form action="list" method="post" class="row g-3">

        <!-- Search Field -->
        <f:if condition="{settings.view.frontendFilter.showSearch}">
            <div class="col-md-3">
                <label for="filter-search" class="form-label fw-bold">Search</label>
                <f:form.textfield name="filter[search]" id="filter-search" value="{filter.search}" class="form-control"
                    placeholder="Project title..." />
            </div>
        </f:if>

        <!-- Filter Dropdowns -->
        <f:if condition="{settings.view.frontendFilter.showFilters}">
            <!-- Project Status Filter -->
            <f:if condition="{availableStatuses}">
                <div class="col-md-2">
                    <label for="filter-status" class="form-label fw-bold">Status</label>
                    <f:form.select name="filter[projectStatus]" id="filter-status" options="{availableStatuses}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.projectStatus}" class="form-select" />
                </div>
            </f:if>

            <!-- Project Type Filter -->
            <f:if condition="{availableTypes}">
                <div class="col-md-2">
                    <label for="filter-type" class="form-label fw-bold">Type</label>
                    <f:form.select name="filter[projectType]" id="filter-type" options="{availableTypes}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.projectType}" class="form-select" />
                </div>
            </f:if>

            <!-- Funding Program Filter -->
            <f:if condition="{availablePrograms}">
                <div class="col-md-2">
                    <label for="filter-program" class="form-label fw-bold">Funding</label>
                    <f:form.select name="filter[fundingProgram]" id="filter-program" options="{availablePrograms}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.fundingProgram}" class="form-select" />
                </div>
            </f:if>

            <!-- Organization Filter -->
            <f:if condition="{availableOrganizations}">
                <div class="col-md-2">
                    <label for="filter-org" class="form-label fw-bold">Organization</label>
                    <f:form.select name="filter[organization]" id="filter-org" options="{availableOrganizations}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.organization}" class="form-select" />
                </div>
            </f:if>
        </f:if>

        <!-- Submit Button -->
        <div class="col-md-2 d-flex align-items-end">
            <f:form.submit value="Filter" class="btn btn-primary w-100" />
        </div>

        <!-- Reset Button -->
        <f:if condition="{settings.view.frontendFilter.showReset}">
            <div class="col-md-auto d-flex align-items-end">
                <f:link.action action="list" extensionName="Academics" pluginName="List"
                    class="btn btn-outline-secondary">Reset</f:link.action>
            </div>
        </f:if>
    </f:form>
</div>

</html>
