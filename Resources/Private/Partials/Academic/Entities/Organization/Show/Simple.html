<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Organization Show/Simple Template
    Simple compact view for Organization entity
    Author: Ernedin Zajko <ezajko@root.ba>
-->
<div class="organization-simple card shadow-sm">
    <div class="card-body">
        <div class="d-flex align-items-center">
            <div class="flex-shrink-0 me-3">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                    style="width: 60px; height: 60px;">
                    <i class="bi bi-building fs-4"></i>
                </div>
            </div>
            <div class="flex-grow-1">
                <h3 class="mb-1">{item.title}</h3>
                <f:if condition="{item.type}">
                    <p class="text-muted mb-2">{item.type.title}</p>
                </f:if>
            </div>
            <f:if condition="{item.acronym}">
                <span class="badge bg-secondary fs-6">{item.acronym}</span>
            </f:if>
        </div>

        <f:if condition="{item.headPerson}">
            <p class="small text-muted mb-2 mt-3">
                <i class="bi bi-person me-1"></i>Head: {item.headPerson.firstName} {item.headPerson.lastName}
            </p>
        </f:if>

        <f:if condition="{item.parent}">
            <p class="small text-muted mb-0">
                <i class="bi bi-diagram-3 me-1"></i>Part of: {item.parent.title}
            </p>
        </f:if>
    </div>
</div>

</html>
