<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="card mb-4">
    <div class="card-body">
        <f:form action="list" method="post" name="filter" object="{filter}" noCacheHash="true">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted">Search</label>
                    <f:form.textfield property="search" class="form-control" placeholder="Search title..." />
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Status</label>
                    <f:form.select property="status" options="{availableStatuses}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Statuses"
                        prependOptionValue="" />
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Type</label>
                    <f:form.select property="type" options="{availableTypes}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Types"
                        prependOptionValue="" />
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Program</label>
                    <f:form.select property="program" options="{availablePrograms}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Programs"
                        prependOptionValue="" />
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Field</label>
                    <f:form.select property="field" options="{availableFields}" optionLabelField="title"
                        optionValueField="uid" class="form-select" prependOptionLabel="All Fields"
                        prependOptionValue="" />
                </div>
                <div class="col-md-1">
                    <f:form.submit value="Filter" class="btn btn-primary w-100" />
                </div>
            </div>

            <!-- Reset Filters -->
            <f:if condition="{filter.search} || {filter.status} || {filter.type} || {filter.program} || {filter.field}">
                <div class="mt-2">
                    <f:link.action action="list" class="btn btn-sm btn-outline-secondary">
                        <core:icon identifier="actions-close" size="small" /> Reset Filters
                    </f:link.action>
                </div>
            </f:if>

        </f:form>
    </div>
</div>

</html>
