<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:for each="{items}" as="item">
    <div class="card mb-3 shadow-sm border-0">
        <div class="row g-0">
            <!-- Image (Left) -->
            <div class="col-md-3">
                <f:if condition="{item.mainImage}">
                    <f:then>
                        <f:media file="{item.mainImage}" class="img-fluid rounded-start h-100 px-0" alt="{item.title}"
                            style="object-fit: cover;" />
                    </f:then>
                    <f:else>
                        <div class="bg-light h-100 d-flex align-items-center justify-content-center"
                            style="min-height: 150px;">
                            <i class="bi bi-kanban fs-1 text-muted"></i>
                        </div>
                    </f:else>
                </f:if>
            </div>

            <!-- Content (Right) -->
            <div class="col-md-9">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h5 class="card-title mb-1">
                            <f:link.action action="show" arguments="{project: item}" pageUid="{detailPid}"
                                pluginName="Pi2" class="text-decoration-none text-dark">
                                {item.title}
                            </f:link.action>
                        </h5>
                        <f:if condition="{item.status}">
                            <span class="badge align-self-start"
                                style="background-color: {item.status.color};">{item.status.title}</span>
                        </f:if>
                    </div>
                    <f:if condition="{item.acronym}">
                        <h6 class="card-subtitle text-muted mb-2">{item.acronym}</h6>
                    </f:if>

                    <p class="card-text">
                        <f:format.crop maxCharacters="200" append="...">
                            <f:format.stripTags>{item.description}</f:format.stripTags>
                        </f:format.crop>
                    </p>
                    <p class="card-text"><small class="text-muted">
                            <i class="bi bi-calendar3"></i>
                            <f:format.date format="d.m.Y">{item.startDate}</f:format.date> - <f:format.date
                                format="d.m.Y">{item.endDate}</f:format.date>
                        </small></p>

                    <div class="mt-2">
                        <f:link.action action="show" arguments="{project: item}" pageUid="{detailPid}" pluginName="Pi2"
                            class="btn btn-sm btn-outline-primary">
                            View Details
                        </f:link.action>
                    </div>
                </div>
            </div>
        </div>
    </div>
</f:for>

</html>
