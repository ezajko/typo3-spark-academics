<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Person List/Simple Template
    Compact list layout for Person list - horizontal rows with minimal info
    Author: Ernedin Zajko <ezajko@root.ba>
-->
<f:if condition="{items}">
    <f:then>
        <div class="list-group">
            <f:for each="{items}" as="item">
                <f:link.action action="show" arguments="{person: item}" pageUid="{detailPid}" pluginName="Show"
                    extensionName="Academics" class="list-group-item list-group-item-action d-flex align-items-center">
                    <!-- Avatar -->
                    <div class="flex-shrink-0 me-3">
                        <f:if condition="{item.mediaImage}">
                            <f:then>
                                <f:media file="{item.mediaImage}" class="rounded-circle"
                                    style="width: 48px; height: 48px; object-fit: cover;"
                                    alt="{item.firstName} {item.lastName}" />
                            </f:then>
                            <f:else>
                                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center"
                                    style="width: 48px; height: 48px;">
                                    <i class="bi bi-person text-muted"></i>
                                </div>
                            </f:else>
                        </f:if>
                    </div>
                    <!-- Content -->
                    <div class="flex-grow-1">
                        <h6 class="mb-0">{item.academicTitle.title} {item.firstName} {item.lastName}</h6>
                        <small class="text-muted">{item.academicRank.title}</small>
                    </div>
                    <!-- Email (optional) -->
                    <f:if condition="{item.contactEmail}">
                        <div class="flex-shrink-0">
                            <span class="badge bg-light text-muted">{item.contactEmail}</span>
                        </div>
                    </f:if>
                </f:link.action>
            </f:for>
        </div>
    </f:then>
    <f:else>
        <div class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            <f:translate key="fe.no_results" extensionName="spark_academics" />
        </div>
    </f:else>
</f:if>

</html>
