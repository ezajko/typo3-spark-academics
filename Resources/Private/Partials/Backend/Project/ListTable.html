<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="table-fit">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>
                    <f:link.action action="list"
                        arguments="{filter: filter, sort: 'title', direction: '{f:if(condition:\" {sort}==\'title\'\",
                        then:\"{f:if(condition:\"{direction}==\'asc\'\", then:\"desc\", else:\"asc\")}\",
                        else:\"asc\")}'}">
                        Title / UUID
                        <f:if condition="{sort} == 'title'">
                            <core:icon
                                identifier="{f:if(condition: '{direction} == \'asc\'', then: 'actions-sort-amount-up', else: 'actions-sort-amount-down')}"
                                size="small" />
                        </f:if>
                    </f:link.action>
                </th>
                <th>
                    <f:link.action action="list"
                        arguments="{filter: filter, sort: 'acronym', direction: '{f:if(condition:\"
                        {sort}==\'acronym\'\", then:\"{f:if(condition:\"{direction}==\'asc\'\", then:\"desc\",
                        else:\"asc\")}\", else:\"asc\")}'}">
                        Abbr
                        <f:if condition="{sort} == 'acronym'">
                            <core:icon
                                identifier="{f:if(condition: '{direction} == \'asc\'', then: 'actions-sort-amount-up', else: 'actions-sort-amount-down')}"
                                size="small" />
                        </f:if>
                    </f:link.action>
                </th>
                <th>
                    <f:link.action action="list"
                        arguments="{filter: filter, sort: 'status', direction: '{f:if(condition:\" {sort}==\'status\'\",
                        then:\"{f:if(condition:\"{direction}==\'asc\'\", then:\"desc\", else:\"asc\")}\",
                        else:\"asc\")}'}">
                        Status
                        <f:if condition="{sort} == 'status'">
                            <core:icon
                                identifier="{f:if(condition: '{direction} == \'asc\'', then: 'actions-sort-amount-up', else: 'actions-sort-amount-down')}"
                                size="small" />
                        </f:if>
                    </f:link.action>
                </th>
                <th>Type</th>
                <th>Program</th>
                <th>
                    <f:link.action action="list"
                        arguments="{filter: filter, sort: 'startDate', direction: '{f:if(condition:\"
                        {sort}==\'startDate\'\", then:\"{f:if(condition:\"{direction}==\'asc\'\", then:\"desc\",
                        else:\"asc\")}\", else:\"asc\")}'}">
                        Dates
                        <f:if condition="{sort} == 'startDate'">
                            <core:icon
                                identifier="{f:if(condition: '{direction} == \'asc\'', then: 'actions-sort-amount-up', else: 'actions-sort-amount-down')}"
                                size="small" />
                        </f:if>
                    </f:link.action>
                </th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <f:for each="{items}" as="row">
                <tr>
                    <td>
                        <b>{row.item.title}</b><br>
                        <small class="text-muted font-monospace">{row.item.uuid}</small>
                    </td>
                    <td>
                        <code>{row.item.acronym}</code>
                    </td>
                    <td>
                        <f:if condition="{row.item.status}">
                            <span class="badge bg-secondary">{row.item.status.title}</span>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{row.item.projectType}">
                            <span class="badge bg-info">{row.item.projectType.title}</span>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{row.item.fundingProgram}">
                            <span class="badge bg-light text-dark border">{row.item.fundingProgram.title}</span>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{row.item.startDate}">
                            <f:format.date format="d.m.Y">{row.item.startDate}</f:format.date>
                        </f:if>
                        <f:if condition="{row.item.endDate}">
                            - <f:format.date format="d.m.Y">{row.item.endDate}</f:format.date>
                        </f:if>
                    </td>
                    <td>
                        <a href="{row.editUrl}" class="btn btn-default btn-sm">
                            <core:icon identifier="actions-open" size="small" /> Edit
                        </a>
                    </td>
                </tr>
            </f:for>
            <f:if condition="{items -> f:count()} == 0">
                <tr>
                    <td colspan="7" class="text-center text-muted py-4">
                        <core:icon identifier="actions-search" size="medium" /><br>
                        No projects found matching your criteria.
                    </td>
                </tr>
            </f:if>
        </tbody>
    </table>
</div>

<!-- Pagination -->
<!-- Pagination -->
<f:render partial="Backend/Pagination" arguments="{_all}" />

</html>
