routeEnhancers:
  AcademicsList:
    type: Extbase
    extension: Academics
    plugin: List
    routes:
      - { routePath: '/page-{currentPage}', _controller: 'Academic::list', _arguments: { currentPage: currentPage } }
      - { routePath: '/filtered', _controller: 'Academic::listFiltered' }
      - { routePath: '/filtered/page-{currentPage}', _controller: 'Academic::listFiltered', _arguments: { currentPage: currentPage } }
    defaultController: 'Academic::list'
    requirements:
      currentPage: \d+
    defaults:
      currentPage: 1
    aspects:
      currentPage:
        type: StaticRangeMapper
        start: '1'
        end: '100'

  AcademicsShow:
    type: Extbase
    extension: Academics
    plugin: Show
    routes:
      - { routePath: '/organization/{organization}', _controller: 'Academic::show', _arguments: { organization: organization } }
      - { routePath: '/course/{course}', _controller: 'Academic::show', _arguments: { course: course } }
      - { routePath: '/program/{program}', _controller: 'Academic::show', _arguments: { studyProgram: program } }
      - { routePath: '/project/{project}', _controller: 'Academic::show', _arguments: { project: project } }
      - { routePath: '/person/{person}', _controller: 'Academic::show', _arguments: { person: person } }
    defaultController: 'Academic::show'
    aspects:
      organization:
        type: PersistedAliasMapper
        tableName: tx_academics_domain_model_organization
        routeFieldName: title
        languageAware: true
      course:
        type: PersistedAliasMapper
        tableName: tx_academics_domain_model_course
        routeFieldName: title
        languageAware: true
      program:
        type: PersistedAliasMapper
        tableName: tx_academics_domain_model_studyprogram
        routeFieldName: title
        languageAware: true
      project:
        type: PersistedAliasMapper
        tableName: tx_academics_domain_model_project
        routeFieldName: title
        languageAware: true
      person:
        type: PersistedAliasMapper
        tableName: tx_academics_domain_model_person
        routeFieldName: email
