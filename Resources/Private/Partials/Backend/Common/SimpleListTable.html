<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Simple List Table for Backend Modules
    Used by organizational and study entity modules
    
    Author: Ernedin Zajko <ezajko@root.ba>
-->
<div class="module-body">
    <f:if condition="{items}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{items}" as="itemData">
                            <tr>
                                <td class="align-middle">
                                    <b>{itemData.item.title}</b>
                                </td>
                                <td class="align-middle">
                                    <f:if condition="{itemData.item.description}">
                                        <small class="text-muted">
                                            <f:format.crop maxCharacters="80">{itemData.item.description}
                                            </f:format.crop>
                                        </small>
                                    </f:if>
                                </td>
                                <td class="align-middle">
                                    <a href="{itemData.editUrl}" class="btn btn-default btn-sm">
                                        <core:icon identifier="actions-open" size="small" />
                                        <f:translate
                                            key="LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.edit" />
                                    </a>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <f:be.infobox title="No records found" state="1">
                <p>No records found matching your criteria.</p>
            </f:be.infobox>
        </f:else>
    </f:if>
</div>

</html>
