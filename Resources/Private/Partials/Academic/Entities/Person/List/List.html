<table>
    <thead>
        <tr>
            <th>UID</th>
            <th>Name</th>
            <th>Primary Department</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <f:for each="{items}" as="person">
            <tr>
                <td>{person.uid}</td>
                <td>{person.firstName} {person.lastName}</td>
                <td>{person.primaryDepartment.title}</td>
                <td>
                    <f:link.action action="show" arguments="{person: person}" pageUid="{detailPid}">Show</f:link.action>
                </td>
            </tr>
        </f:for>
    </tbody>
</table>
