<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="card mb-3 border-0 shadow-sm">
    <div class="card-body">
        <f:if condition="{item.status}">
            <div class="mb-2">
                <span class="badge" style="background-color: {item.status.color};">{item.status.title}</span>
            </div>
        </f:if>

        <h1 class="display-6 mb-3">{item.title}</h1>

        <f:if condition="{item.acronym}">
            <h4 class="text-muted mb-3">{item.acronym}</h4>
        </f:if>

        <div class="mb-4 lead">
            <f:format.html>{item.description}</f:format.html>
        </div>

        <div class="row text-muted">
            <div class="col-md-6">
                <f:if condition="{item.startDate}">
                    <strong>Start Date:</strong>
                    <f:format.date format="d.m.Y">{item.startDate}</f:format.date>
                </f:if>
            </div>
            <div class="col-md-6">
                <f:if condition="{item.endDate}">
                    <strong>End Date:</strong>
                    <f:format.date format="d.m.Y">{item.endDate}</f:format.date>
                </f:if>
            </div>
        </div>

        <f:if condition="{item.website}">
            <div class="mt-3">
                <a href="{item.website}" target="_blank" class="btn btn-outline-primary">Visit Website</a>
            </div>
        </f:if>
    </div>
</div>

</html>
