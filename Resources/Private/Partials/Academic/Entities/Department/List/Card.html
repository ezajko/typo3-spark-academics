<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="col">
    <div class="card h-100 shadow-sm border-0">
        <f:if condition="{item.mainImage}">
            <f:then>
                <f:media file="{item.mainImage}" class="card-img-top" alt="{item.title}"
                    style="height: 200px; object-fit: cover;" />
            </f:then>
            <f:else>
                <div class="card-img-top bg-light d-flex align-items-center justify-content-center"
                    style="height: 200px;">
                    <i class="bi bi-building fs-1 text-muted"></i>
                </div>
            </f:else>
        </f:if>

        <div class="card-body">
            <h5 class="card-title">
                <f:link.action action="show" arguments="{department: item}" pageUid="{detailPid}"
                    class="text-decoration-none text-dark stretched-link">
                    {item.title}
                </f:link.action>
            </h5>
            <f:if condition="{item.acronym}">
                <h6 class="card-subtitle mb-2 text-muted">{item.acronym}</h6>
            </f:if>

            <p class="card-text text-truncate-3">
                <f:format.crop maxCharacters="150" append="...">
                    <f:format.stripTags>{item.description}</f:format.stripTags>
                </f:format.crop>
            </p>
        </div>
        <div class="card-footer bg-white border-0">
            <small class="text-muted">
                <i class="bi bi-people me-1"></i> {item.persons -> f:count()} Members
                <span class="mx-2">|</span>
                <i class="bi bi-diagram-3 me-1"></i> {item.chairs -> f:count()} Chairs
            </small>
        </div>
    </div>
</div>

</html>
