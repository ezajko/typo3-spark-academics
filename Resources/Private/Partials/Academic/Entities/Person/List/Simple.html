<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:for each="{items}" as="item">
    <div class="card mb-3 shadow-sm border-0">
        <div class="row g-0 align-items-center">
            <div class="col-md-2 text-center p-3">
                <div class="mx-auto" style="width: 80px; height: 80px;">
                    <f:if condition="{item.mediaImage}">
                        <f:then>
                            <f:media file="{item.mediaImage}" class="rounded-circle w-100 h-100"
                                alt="{item.firstName} {item.lastName}" style="object-fit: cover;" />
                        </f:then>
                        <f:else>
                            <div
                                class="rounded-circle w-100 h-100 bg-light d-flex align-items-center justify-content-center">
                                <i class="bi bi-person fs-2 text-muted"></i>
                            </div>
                        </f:else>
                    </f:if>
                </div>
            </div>
            <div class="col-md-10">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="card-title mb-1">
                                <f:link.action action="show" arguments="{person: item}" pageUid="{detailPid}"
                                    pluginName="Pi2" class="text-decoration-none text-dark">
                                    {item.academicTitle.title} {item.firstName} {item.lastName}
                                </f:link.action>
                            </h5>
                            <p class="card-text text-muted mb-0">
                                <f:if condition="{item.academicRank}">
                                    {item.academicRank.title}
                                </f:if>
                                <f:if condition="{item.primaryDepartment}">
                                    &bull; {item.primaryDepartment.title}
                                </f:if>
                            </p>
                        </div>
                        <div class="text-end d-none d-md-block">
                            <f:if condition="{item.contactEmail}">
                                <div><a href="mailto:{item.contactEmail}" class="text-decoration-none text-muted"><i
                                            class="bi bi-envelope me-1"></i> {item.contactEmail}</a></div>
                            </f:if>
                            <f:if condition="{item.phoneOffice}">
                                <small class="text-muted"><i class="bi bi-telephone me-1"></i>
                                    {item.phoneOffice}</small>
                            </f:if>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</f:for>

</html>
