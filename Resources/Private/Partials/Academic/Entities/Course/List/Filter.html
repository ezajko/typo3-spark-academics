<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Course Frontend Filter
    Filter by organization, study cycle, category, scientific field
    Author: Ernedin Zajko <ezajko@root.ba>
-->

<div class="spark-academics-filter mb-4 p-4 bg-light rounded">
    <f:form action="list" method="post" class="row g-3">

        <!-- Search Field -->
        <f:if condition="{settings.view.frontendFilter.showSearch}">
            <div class="col-md-3">
                <label for="filter-search" class="form-label fw-bold">Search</label>
                <f:form.textfield name="filter[search]" id="filter-search" value="{filter.search}" class="form-control"
                    placeholder="Course title..." />
            </div>
        </f:if>

        <!-- Filter Dropdowns -->
        <f:if condition="{settings.view.frontendFilter.showFilters}">
            <!-- Organization Filter -->
            <f:if condition="{availableOrganizations}">
                <div class="col-md-2">
                    <label for="filter-org" class="form-label fw-bold">Organization</label>
                    <f:form.select name="filter[organization]" id="filter-org" options="{availableOrganizations}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.organization}" class="form-select" />
                </div>
            </f:if>

            <!-- Study Cycle Filter -->
            <f:if condition="{availableCycles}">
                <div class="col-md-2">
                    <label for="filter-cycle" class="form-label fw-bold">Study Cycle</label>
                    <f:form.select name="filter[studyCycle]" id="filter-cycle" options="{availableCycles}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.studyCycle}" class="form-select" />
                </div>
            </f:if>

            <!-- Category Filter -->
            <f:if condition="{availableCategories}">
                <div class="col-md-2">
                    <label for="filter-category" class="form-label fw-bold">Category</label>
                    <f:form.select name="filter[courseCategory]" id="filter-category" options="{availableCategories}"
                        optionValueField="uid" optionLabelField="title" prependOptionLabel="-- All --"
                        prependOptionValue="" value="{filter.courseCategory}" class="form-select" />
                </div>
            </f:if>
        </f:if>

        <!-- Submit Button -->
        <div class="col-md-2 d-flex align-items-end">
            <f:form.submit value="Filter" class="btn btn-primary w-100" />
        </div>

        <!-- Reset Button -->
        <f:if condition="{settings.view.frontendFilter.showReset}">
            <div class="col-md-auto d-flex align-items-end">
                <f:link.action action="list" extensionName="Academics" pluginName="List"
                    class="btn btn-outline-secondary">Reset</f:link.action>
            </div>
        </f:if>
    </f:form>
</div>

</html>
