<f:if condition="{entityType} == 'person'">
    <f:then>
        <f:render partial="Academic/Entities/Person/List" arguments="{persons: items, detailPid: detailPid}" />
    </f:then>
    <f:else>
        <f:if condition="{entityType} == 'lab'">
            <f:then>
                <f:render partial="Academic/Entities/ResearchLab/List"
                    arguments="{items: items, detailPid: detailPid}" />
            </f:then>
            <f:else>
                <f:if condition="{entityType} == 'group'">
                    <f:then>
                        <f:render partial="Academic/Entities/ResearchGroup/List"
                            arguments="{items: items, detailPid: detailPid}" />
                    </f:then>
                    <f:else>
                        <f:if condition="{entityType} == 'program'">
                            <f:then>
                                <f:render partial="Academic/Entities/StudyProgram/List"
                                    arguments="{items: items, detailPid: detailPid}" />
                            </f:then>
                            <f:else>
                                <f:render
                                    partial="Academic/Entities/{entityType -> f:format.case(mode: 'capital')}/List"
                                    arguments="{items: items, detailPid: detailPid}" />
                            </f:else>
                        </f:if>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
    </f:else>
</f:if>
