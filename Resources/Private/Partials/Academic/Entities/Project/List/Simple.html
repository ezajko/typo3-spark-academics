<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
    Project List Simple Template
    Card layout with image, status badge, dates, budget, and funding program
    Author: Ernedin Zajko <ezajko@root.ba>
-->
<f:for each="{items}" as="item">
    <div class="card mb-3 shadow-sm border-0">
        <div class="row g-0">
            <!-- Image (Left) -->
            <div class="col-md-3">
                <f:if condition="{item.mainImage}">
                    <f:then>
                        <f:media file="{item.mainImage}" class="img-fluid rounded-start h-100 px-0" alt="{item.title}"
                            style="object-fit: cover;" />
                    </f:then>
                    <f:else>
                        <div class="bg-light h-100 d-flex align-items-center justify-content-center"
                            style="min-height: 180px;">
                            <i class="bi bi-kanban fs-1 text-muted"></i>
                        </div>
                    </f:else>
                </f:if>
            </div>

            <!-- Content (Right) -->
            <div class="col-md-9">
                <div class="card-body">
                    <!-- Title and Status -->
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <h5 class="card-title mb-0">
                                <f:link.action action="show" arguments="{project: item}" pageUid="{detailPid}"
                                    pluginName="Show" extensionName="Academics" class="text-decoration-none text-dark">
                                    {item.title}</f:link.action>
                            </h5>
                            <f:if condition="{item.acronym}">
                                <span class="text-muted fw-bold">({item.acronym})</span>
                            </f:if>
                        </div>
                        <f:if condition="{item.status}">
                            <span class="badge bg-secondary">{item.status.title}</span>
                        </f:if>
                    </div>

                    <!-- Badges: Type, Funding Program -->
                    <div class="mb-2">
                        <f:if condition="{item.projectType}">
                            <span class="badge bg-primary me-1"><i
                                    class="bi bi-tag me-1"></i>{item.projectType.title}</span>
                        </f:if>
                        <f:if condition="{item.fundingProgram}">
                            <span class="badge bg-info text-dark me-1"><i
                                    class="bi bi-bank me-1"></i>{item.fundingProgram.title}</span>
                        </f:if>
                    </div>

                    <!-- Description -->
                    <p class="card-text small mb-2">
                        <f:format.crop maxCharacters="180" append="...">
                            <f:format.stripTags>{item.description}</f:format.stripTags>
                        </f:format.crop>
                    </p>

                    <!-- Meta: Dates, Budget -->
                    <div class="d-flex flex-wrap gap-3 small text-muted mb-2">
                        <f:if condition="{item.startDate}">
                            <span><i class="bi bi-calendar3 me-1"></i>
                                <f:format.date format="M Y">{item.startDate}</f:format.date> - <f:format.date
                                    format="M Y">{item.endDate}</f:format.date>
                            </span>
                        </f:if>
                        <f:if condition="{item.totalBudget}">
                            <span><i class="bi bi-currency-euro me-1"></i>
                                <f:format.number decimals="0" thousandsSeparator=",">{item.totalBudget}
                                </f:format.number>
                            </span>
                        </f:if>
                        <f:if condition="{item.grantAgreementNumber}">
                            <span><i class="bi bi-file-earmark-text me-1"></i>{item.grantAgreementNumber}</span>
                        </f:if>
                    </div>

                    <!-- Scientific Fields -->
                    <f:if condition="{item.scientificFields}">
                        <div class="mb-2">
                            <f:for each="{item.scientificFields}" as="field">
                                <span class="badge bg-light text-dark border me-1">{field.title}</span>
                            </f:for>
                        </div>
                    </f:if>

                    <!-- View Details Button -->
                    <f:link.action action="show" arguments="{project: item}" pageUid="{detailPid}" pluginName="Show"
                        extensionName="Academics" class="btn btn-sm btn-outline-primary">View Details</f:link.action>
                </div>
            </div>
        </div>
    </div>
</f:for>

</html>
