<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="card mb-3 border-0 shadow-sm">
    <div class="card-body text-center p-5">
        <div class="mb-4">
            <f:if condition="{item.mediaImage}">
                <f:then>
                    <f:media file="{item.mediaImage}" class="rounded-circle shadow"
                        style="width: 150px; height: 150px; object-fit: cover;"
                        alt="{item.firstName} {item.lastName}" />
                </f:then>
                <f:else>
                    <div class="mx-auto rounded-circle bg-light d-flex align-items-center justify-content-center shadow"
                        style="width: 150px; height: 150px;">
                        <i class="bi bi-person fs-1 text-muted"></i>
                    </div>
                </f:else>
            </f:if>
        </div>

        <h2 class="fw-bold mb-1">{item.academicTitle.title} {item.firstName} {item.lastName}</h2>
        <p class="text-muted lead mb-4">{item.academicRank.title}</p>

        <div class="d-flex justify-content-center gap-3">
            <f:if condition="{item.contactEmail}">
                <a href="mailto:{item.contactEmail}" class="btn btn-primary"><i class="bi bi-envelope me-2"></i>
                    Email</a>
            </f:if>
            <f:if condition="{item.contactWebsite}">
                <a href="{item.contactWebsite}" target="_blank" class="btn btn-outline-secondary"><i
                        class="bi bi-globe me-2"></i> Website</a>
            </f:if>
        </div>
    </div>
</div>

</html>
