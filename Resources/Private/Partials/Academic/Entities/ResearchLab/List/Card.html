<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="row row-cols-1 row-cols-md-3 g-4">
    <f:for each="{items}" as="item">
        <div class="col">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{item.title}</h5>
                    <f:if condition="{item.landingPage}">
                        <f:then>
                            <f:link.page pageUid="{item.landingPage}" class="btn btn-primary btn-sm mt-3">
                                Read more
                            </f:link.page>
                        </f:then>
                        <f:else>
                            <f:link.action action="show" arguments="{lab: item}" pageUid="{detailPid}"
                                class="btn btn-primary btn-sm mt-3">
                                Read more
                            </f:link.action>
                        </f:else>
                    </f:if>
                </div>
            </div>
        </div>
    </f:for>
</div>

</html>
