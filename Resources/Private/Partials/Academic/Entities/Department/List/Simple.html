<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="list-group list-group-flush">
    <f:for each="{items}" as="item">
        <div class="list-group-item list-group-item-action border-0 shadow-sm mb-2 rounded bg-white">
            <div class="d-flex w-100 justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="me-3 text-muted">
                        <i class="bi bi-building fs-4"></i>
                    </div>
                    <div>
                        <h5 class="mb-1">
                            <f:link.action action="show" arguments="{department: item}" pageUid="{detailPid}"
                                pluginName="Pi2" class="text-decoration-none text-dark stretched-link">
                                {item.title}
                            </f:link.action>
                        </h5>
                        <small class="text-muted">
                            <f:format.crop maxCharacters="80" append="...">{item.description}</f:format.crop>
                        </small>
                    </div>
                </div>
                <span class="badge bg-light text-dark rounded-pill">Staff: {item.people -> f:count()}</span>
            </div>
        </div>
    </f:for>
</div>

</html>
