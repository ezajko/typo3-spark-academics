<div class="card">
    <div class="card-body">
        <h5 class="card-title">{item.firstName} {item.lastName}</h5>
        <h6 class="card-subtitle mb-2 text-muted">{item.academicTitle.title}</h6>
        <p class="card-text"><f:format.crop maxCharacters="150">{item.biography}</f:format.crop></p>
        <f:if condition="{item.contactEmail}">
            <a href="mailto:{item.contactEmail}" class="card-link">{item.contactEmail}</a>
        </f:if>
    </div>
</div>
